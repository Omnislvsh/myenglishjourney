site_name: My English Journey
site_url: https://omnislvsh.github.io/myenglishjourney/
site_description: Личный сайт для отслеживания прогресса в английском языке — словарь, тексты, статистика
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.ico
  language: ru
  palette:
    - scheme: default
      toggle: {icon: material/weather-night, name: Тёмная тема}
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Светлая тема}
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.prune
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - toc.follow
plugins:
  - search:
      lang:
        - ru
        - en
  - roamlinks
  - awesome-pages
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

watch:
  - overrides

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

copyright: 'Связаться со мной: <a href="mailto:fedmax012@gmail.com">fedmax012@gmail.com</a>'

extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/omnislvsh
      name: Telegram
    - icon: fontawesome/brands/github
      link: https://github.com/Omnislvsh
      name: GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:st154542@student.spbu.ru
      name: Почта
